#
# NomadBSD override: start dhclient on link-up at a priority that beats
# every other devd rule on the image.
#
# devd(8) executes only the single highest-priority rule matching an
# event; equal priorities are resolved by config scan order, which
# follows readdir() and is therefore an accident of the filesystem.
# Two rule sets compete with the base system's "notify 0" dhclient
# rules here: NetworkMgr's "notify 5" IFNET rules, and NomadBSD's own
# fetch-fw.conf, which used to match LINK_UP at 100 and could win the
# tie against dhclient - leaving the interface with no IPv4 at all.
#
# Priority 200 makes DHCP unconditionally win LINK_UP. fetch-fw now
# triggers on ADDR_ADD only, i.e. after dhclient has done its job.
#
# This file lives in /etc/devd (root filesystem, not the uzip) so devd
# sees it regardless of where its startup falls relative to mount_uzip,
# and it deliberately does NOT modify the stock /etc/devd/dhclient.conf,
# which etcupdate/freebsd-update would revert.
#
notify 200 {
	match "system"		"IFNET";
	match "type"		"LINK_UP";
	media-type		"ethernet";
	action "service dhclient quietstart $subsystem";
};

notify 200 {
	match "system"		"IFNET";
	match "type"		"LINK_UP";
	media-type		"802.11";
	action "service dhclient quietstart $subsystem";
};
