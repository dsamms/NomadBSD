
# Fetch firmware once an address has been assigned (ADDR_ADD fires
# after dhclient or static configuration). Matching LINK_UP here as
# well used to tie with the dhclient rules at the same priority and
# could win the tie, blocking DHCP entirely - see
# /etc/devd/nomadbsd-dhclient.conf.
notify 100 {
	match "system"		"IFNET";
	match "type"		"ADDR_ADD";
	action "daemon /usr/bin/fetch-fw";
};

